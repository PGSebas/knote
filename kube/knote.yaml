apiVersion: apps/v1
kind: Deployment
metadata:
  name: knote
spec:
  selector:
    matchLabels:
      app: knote
  template:
    metadata:
      labels:
        app: knote
    spec:
      containers:
        - name: knote
          image: juanchito1527/knote:2.0.0
          imagePullPolicy: Never
          env:
            - name: MONGO_HOST
              value: mongo
            - name: MINIO_HOST
              value: minio
            - name: MINIO_ACCESS_KEY
              value: mykey
            - name: MINIO_SECRET_KEY
              value: mysecret
            - name: JAVA_TOOL_OPTIONS
              value: "-Dminio.host=minio -Dminio.port=9000"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: knote
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30000
  selector:
    app: knote
